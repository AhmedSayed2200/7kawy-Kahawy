<section class="w-[95%] m-auto">
  <div class="relative">
    <!-- --- cover img-------- -->
    <div class="peer">
      <img
        class="w-full h-[30vh] lg:h-[45vh] rounded-[30px] object-contain"
        [src]="user.cover"
        alt=""
      />
    </div>
    @if (myId == userId) {
      <!-- --- input cover img-------- -->
      <div
        class="absolute opacity-0 peer-hover:opacity-100 z-20 right-[5%] sm:p-3 p-2 top-[20px] bg-black/80 transition-all duration-500 cursor-pointer hover:bg-black rounded-full"
      >
        <input
          #coverProfile
          (change)="setCoverProfile(coverProfile)"
          hidden
          type="file"
          id="inputCoverProfile"
        />
        <label for="inputCoverProfile"
          ><i class="fa-regular fa-camera sm:text-2xl text-xl text-white"></i
        ></label>
      </div>
    }
    <div class="relative">
      <div
        class="absolute left-4 sm:left-8 bottom-0 translate-y-1/2 w-[200px] md:w-[280px] lg:w-[360px] text-center"
      >
        <!-- --- profile img-------- -->
        <div class="w-full peer aspect-square">
          <img
            class="w-full h-full object-cover rounded-full border-4 border-white transition-all duration-500 hover:border-blue-400 shadow-lg"
            [src]="user.photo"
            alt="Profile"
          />
        </div>
        <!-- --- input profile img-------- -->
        @if (myId == userId) {
          <!-- --- input cover img-------- -->
          <div
            class="absolute opacity-0 peer-hover:opacity-100 z-50 right-[50%] bottom-[50px] hover:opacity-100 translate-x-1/2 sm:p-3 p-2 bg-black/80 transition-all duration-500 cursor-pointer hover:bg-black rounded-full"
          >
            <input
              #PhotoProfile
              (change)="setPhotoProfile(PhotoProfile)"
              hidden
              type="file"
              id="inputPhotoProfile"
            />
            <label for="inputPhotoProfile"
              ><i class="fa-regular fa-camera sm:text-2xl text-xl text-white"></i
            ></label>
          </div>
        }

        <!---- user Info ----->
        <div class="mt-3 text-black">
          <h1 class="text-lg md:text-xl font-bold tracking-tight text-body">{{ user.name }}</h1>
          <span class="text-xs md:text-[13px] text-body">{{ user.email }}</span>
        </div>
      </div>

      <!-- <div class="hidden sm:flex">
        <div>
          <img
            class="w-[100px] h-[100px] hidden lg:block object-cover absolute left-[33%] -translate-x-1/2"
            src="/images/hi.webp"
            alt=""
          />
        </div>

      </div> -->
      <!-- -----user list info----- -->
      <div
        class="absolute left-[68%] xl:left-[70%] -translate-x-1/2 hidden sm:flex translate-y-1/2 items-center justify-center gap-2 xl:gap-6 bg-slate-50 dark:text-body dark:bg-neutral-secondary-medium p-2 lg:p-3 xl:p-4 rounded-2xl border border-slate-200/60 dark:border-slate-850 shadow-xl max-w-2xl mx-auto mt-4"
      >
        <div class="flex flex-col items-center text-center px-4 py-1 flex-1 min-w-[80px]">
          <span class="text-xl sm:text-2xl font-extrabold">{{ postCount }}</span>
          <span class="text-[11px] font-semibold uppercase tracking-wider text-slate-400 mt-0.5"
            >My Posts</span
          >
        </div>
        <div class="hidden sm:block h-8 w-[0.5px] bg-slate-800 dark:bg-white"></div>

        <!-- 2. Bookmarks -->
        <div class="flex flex-col items-center text-center px-4 py-1 flex-1 min-w-[80px]">
          <span class="text-xl sm:text-2xl font-extrabold">{{ bookmarksCount }}</span>
          <span class="text-[11px] font-semibold uppercase tracking-wider text-slate-400 mt-0.5"
            >Bookmarks</span
          >
        </div>

        <div class="hidden sm:block h-8 w-[0.5px] bg-slate-800 dark:bg-white"></div>

        <!-- 4. Followers -->
        <div class="flex flex-col items-center text-center px-4 py-1 flex-1 min-w-[80px]">
          <span class="text-xl sm:text-2xl font-extrabold">{{ followersCount }}</span>
          <span class="text-[11px] font-semibold uppercase tracking-wider text-slate-400 mt-0.5"
            >Followers</span
          >
        </div>

        <div class="hidden sm:block h-8 w-[0.5px] bg-slate-800 dark:bg-white"></div>

        <!-- 5. Following -->
        <div class="flex flex-col items-center text-center px-4 py-1 flex-1 min-w-[80px]">
          <span class="text-xl sm:text-2xl font-extrabold">{{ followingCount }}</span>
          <span class="text-[11px] font-semibold uppercase tracking-wider text-slate-400 mt-0.5"
            >Following</span
          >
        </div>
      </div>
    </div>
  </div>
