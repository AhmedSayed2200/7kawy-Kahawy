@for (post of postList; track post._id) {
  <app-post-cart
    (EventEmitterBookmarks)="getAllBookMaks()"
    [isFromBookmarks]="true"
    [post]="post"
  ></app-post-cart>
} @empty {
  <div class="flex justify-center items-center h-full">
    <img class="w-[60%]" src="/images/nopostsfollowing.png" alt="" />
  </div>
}
