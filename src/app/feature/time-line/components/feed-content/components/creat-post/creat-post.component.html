<section>
  <form
    #form
    (submit)="sendData($event, form)"
    class="w-full bg-white dark:bg-darkBg rounded-[16px] shadow-sm border border-slate-200 p-4 font-sans flex flex-col"
  >
    <!------ User Details --------->
    <div class="flex items-center gap-3 mb-3">
      <img
        [src]="userDetails.photo"
        [alt]="userDetails.name"
        class="w-10 h-10 rounded-full bg-slate-100 border border-slate-50"
      />
      <div class="flex justify-between w-full">
        <div class="flex flex-col">
          <span class="text-[15px] font-bold text-slate-900 dark:text-body leading-tight">{{
            userDetails.name
          }}</span>
          <span class="dark:text-body">@ {{ userDetails.username }}</span>
        </div>

        <div
          class="flex p-1 me-3 w-fit items-center bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand shadow-xs placeholder:text-body"
        >
          <i class="fa-solid fa-earth-americas text-[11px] text-slate-600 dark:text-body"></i>
          <select
            [formControl]="privacy"
            class="border-none pe-5 bg-transparent dark:text-body cursor-pointer ring-0 text-xs"
          >
            <option class="dark:text-black" value="public">public</option>
            <option class="dark:text-black" value="following">followers</option>
            <option class="dark:text-black" value="only_me">only me</option>
          </select>
        </div>
      </div>
    </div>
    <!------ inputs data --------->
    <div class="mb-4">
      <textarea
        [(ngModel)]="postText"
        [formControl]="bodyContent"
        class="w-full bg-slate-50 border border-slate-200 dark:bg-darkBg dark:text-body rounded-xl p-3.5 text-[15px] text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-4 focus:ring-blue-50 focus:border-blue-300 transition-all resize-y min-h-[50px]"
        placeholder="What's on your mind...?"
        aria-label="Create a new post"
      ></textarea>
    </div>
    @if (imgUrl) {
      <img [src]="imgUrl" class="w-sm object-cover mx-auto mb-3" alt="" />
    }
    <hr class="border-t border-slate-800 mb-4" />

    <div class="flex items-center justify-between">
      <div class="flex gap-2 items-center">
        <div>
          <input #element type="file" id="file" (change)="saveImage(element)" class="hidden" />
          <label
            for="file"
            class="flex cursor-pointer items-center gap-2 text-slate-600 dark:hover:bg-dark/50 hover:bg-slate-50 px-2 py-1.5 rounded-lg transition-colors group"
          >
            <i
              class="fa-regular fa-image text-[#22c55e] text-[1.1rem] group-hover:scale-110 transition-transform"
            ></i>
            <span class="text-[14px] font-semibold text-slate-600 dark:text-body">Photo</span>
          </label>
        </div>

        <div>
          <button
            id="emojiMenuButton"
            data-dropdown-toggle="emojiDropdown"
            data-dropdown-placement="bottom-start"
            class="group flex items-center cursor-pointer dark:text-body gap-2 p-2 hover:bg-slate-100 dark:hover:bg-neutral-secondary-medium rounded-lg text-sm font-medium"
            type="button"
          >
            <span class="transition-transform duration-200 group-hover:scale-125">😊</span> Feeling
          </button>

          <div id="emojiDropdown" class="z-40 hidden bg-white rounded-lg shadow-lg">
            <emoji-mart (emojiSelect)="addEmoji($event)" title="Pick your emoji…" emoji="point_up">
            </emoji-mart>
          </div>
        </div>

        <div></div>
      </div>

      <button
        class="cursor-pointer bg-blue-500 hover:bg-blue-800 text-white px-5 py-2 rounded-lg font-bold text-[14px] flex items-center gap-2 focus:ring-4 focus:ring-blue-200 outline-none"
      >
        Post
        <i class="fa-regular fa-paper-plane text-sm"></i>
      </button>
    </div>
  </form>
</section>
